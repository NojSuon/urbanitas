[package]
name = "urbanitas"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Noj Suon"]
description = "Procedural building generator: floors, rooms, gardens and architectural styles, exported as OBJ meshes, SVG floor plans and JSON."
license = "MIT"
repository = "https://github.com/NojSuon/urbanitas"
homepage = "https://github.com/NojSuon/urbanitas"
readme = "README.md"
keywords = ["procedural", "generation", "architecture", "building", "obj"]
categories = ["game-development", "graphics", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
