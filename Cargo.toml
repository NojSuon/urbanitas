[package]
name = "urbanitas"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["Noj Suon"]
description = "Procedural building generator: floors, rooms, gardens and architectural styles, exported as OBJ meshes, SVG floor plans and JSON."
license = "MIT"
repository = "https://github.com/NojSuon/urbanitas"
homepage = "https://github.com/NojSuon/urbanitas"
readme = "README.md"
keywords = ["procedural", "generation", "architecture", "building", "obj"]
categories = ["game-development", "graphics", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Exact float round trips, so a saved project reloads identically.
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"

[workspace]
members = [".", "urbanitas-app"]

# Bevy is slow in plain debug builds. Optimize dependencies fully and our own
# code a little, so `cargo run` stays smooth while compiles stay fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The generator, mesher and texture painter run every time a parameter changes.
[profile.dev.package.urbanitas]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
