[package]
name = "urbanitas-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["Noj Suon"]
description = "Interactive Urbanitas building app: generate buildings live and edit them part by part."
license = "MIT"
repository = "https://github.com/NojSuon/urbanitas"
publish = false

[[bin]]
name = "urbanitas-app"
path = "src/main.rs"

[dependencies]
urbanitas = { path = ".." }
bevy = "0.20.1"
bevy_egui = "0.43.1"
bevy_panorbit_camera = { version = "0.36", features = ["bevy_egui"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
